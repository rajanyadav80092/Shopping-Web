{% extends 'home.html' %}
{% block content %}
<div class="glash-div">
<form action="/backend/addbank" method ="post">
     <input class="glash-input" type="text" name="name" placeholder="Enter your bank name" required><br><br>
    <input class="glash-input" type="number" name="amount" placeholder="Enter your balance" required><br><br>
    <input class="glash-input" type="number" name="account" placeholder="Enter your account_number" required><br><br>
    <input class="glash-input" type="text" name="mobile" placeholder="Enter your mobile number" required><br><br>
    <input class="glash-input" type="password" name="password" placeholder="Enter your password" required><br><br>
    <button class="glash-btn" type="submit">Credit</button>
</form>
</div>
{% endblock %}
